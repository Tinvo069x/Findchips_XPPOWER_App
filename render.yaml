services:
  - type: web
    name: findchips-xppower-app-sg
    runtime: docker
    region: singapore
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/health
    envVars:
      - key: FINDCHIPS_NO_OPEN
        value: "1"
      - key: CORS_ORIGIN
        value: "*"
      - key: FINDCHIPS_SCROLL_WAIT_MS
        value: "900"
      - key: FINDCHIPS_BOTTOM_WAIT_MS
        value: "1800"
      - key: FINDCHIPS_SETTLE_WAIT_MS
        value: "5000"
      - key: FINDCHIPS_MAX_SCROLL_PASSES
        value: "4"
